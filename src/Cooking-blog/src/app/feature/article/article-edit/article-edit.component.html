<ng-template [ngIf]="article">
  <form
    [formGroup]="editArticleForm"
    (ngSubmit)="editArticle()"
  >
    <div class="container">
      <fieldset>
        <h2 class="label">Update article</h2>

        <!-- Headline -->
        <p class="field field-icon">
          <label for="headline">
            <span><i class="fas fa-heading"></i></span>
          </label>

          <input
            formControlName="headline"
            [class.input-error]="
              f['headline'].touched && f['headline'].invalid
            "
            type="text"
            name="headline"
            id="headline"
            placeholder="Enter your title"
          />
        </p>

        <ng-container
          *ngIf="f['headline'].touched && f['headline'].invalid"
        >
          <p
            *ngIf="f['headline'].errors?.['required']"
            class="alert alert-danger"
          >
            Title is required!
          </p>

          <p
            *ngIf="f['headline'].errors?.['maxlength']"
            class="alert alert-danger"
          >
            The text must be not more than
            {{ f['headline'].errors?.['maxlength'].requiredLength }}
            characters.
          </p>
        </ng-container>

        <!-- Content -->
        <p class="field field-icon">
          <textarea
            formControlName="content"
            [class.input-error]="
              f['content'].touched && f['content'].invalid
            "
            rows="8"
            name="content"
            id="content"
            placeholder="Enter your content here"
          ></textarea>
        </p>

        <ng-container
          *ngIf="f['content'].touched && f['content'].invalid"
        >
          <p
            *ngIf="f['content'].errors?.['required']"
            class="alert alert-danger"
          >
            Content is required!
          </p>

          <p
            *ngIf="f['content'].errors?.['minlength']"
            class="alert alert-danger"
          >
            The text must be at least
            {{ f['content'].errors?.['minlength'].requiredLength }}
            characters.
          </p>
        </ng-container>

        <!-- Image URL -->
        <p class="field field-icon">
          <label for="image">
            <span><i class="fa fa-image"></i></span>
          </label>

          <input
            formControlName="image"
            [class.input-error]="
              f['image'].touched && f['image'].invalid
            "
            type="text"
            name="image"
            id="image"
            placeholder="Add image link (optional)"
          />
        </p>

        <ng-container
          *ngIf="f['image'].touched && f['image'].invalid"
        >
          <p
            *ngIf="f['image'].hasError('articleImage')"
            class="alert alert-danger"
          >
            Please enter a valid image URL!
          </p>
        </ng-container>

        <div class="buttons">
          <button
            type="button"
            class="btn btn-warning btn-block"
            (click)="cancel()"
          >
            Cancel
          </button>

          &nbsp;

          <button
            type="submit"
            class="btn btn-primary btn-block"
            [disabled]="editArticleForm.invalid"
          >
            Update article
          </button>
        </div>
      </fieldset>
    </div>
  </form>
</ng-template>
